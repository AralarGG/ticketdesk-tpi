# Configuración de conexión a PostgreSQL
# Reemplazar estos valores por los de tu base de datos local o en la nube (Supabase, Render, etc.)
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketdesk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update: crea/actualiza las tablas automáticamente según las entidades.
# Util para desarrollo. En producción se recomienda usar migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Tamaño máximo de archivos subidos (fotos y audios de tickets).
# El valor por defecto de Spring Boot es muy chico (1MB) para fotos de celular.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Credenciales de Cloudinary para subir fotos y audios.
# Se consiguen gratis registrandose en cloudinary.com, en el panel "Dashboard".
# Los valores reales NO se escriben en este archivo porque se sube al repositorio
# publico. Se leen de variables de entorno: CLOUDINARY_CLOUD_NAME,
# CLOUDINARY_API_KEY y CLOUDINARY_API_SECRET. Si no estan definidas, se usa el
# valor por defecto de la derecha (solo para que el proyecto arranque).
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:TU_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:TU_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:TU_API_SECRET}
